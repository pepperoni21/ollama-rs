[package]
name = "ollama-rs-macros"
edition = "2021"
license-file = "../LICENSE.md"
description = "Procedural macros for ollama-rs"
repository = "https://github.com/pepperoni21/ollama-rs"
readme = "../README.md"
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
macrotest = "1"
# The macro emits `ollama_rs::...` paths, so macrotest's generated crate needs
# an `ollama-rs` dependency. The stub keeps derive expansions out of the
# snapshots.
ollama-rs = { package = "ollama-rs-macros-test-stub", path = "tests/stubs/ollama-rs-macros-test-stub" }
